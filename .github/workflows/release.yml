name: Release

# Publishes a GitHub release whenever the version in manifest.json changes on main
# (or when a v* tag is pushed, or when run by hand from the Actions tab).
# If the AMO_JWT_ISSUER and AMO_JWT_SECRET repository secrets are set, the add-on is signed by
# Mozilla (unlisted, so it isn't public on addons.mozilla.org) and the signed .xpi is attached —
# that's the file anyone can install in normal Firefox. Without the secrets, only an unsigned
# package is attached. After adding the secrets, run this workflow by hand to attach the signed file.

on:
  push:
    branches: [main]
    paths: [manifest.json, .github/workflows/release.yml]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Never run two releases at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Only the "Sign with Mozilla" step can see the Mozilla keys; this just records whether they exist.
    env:
      GH_TOKEN: ${{ github.token }}
      HAS_AMO_KEYS: ${{ secrets.AMO_JWT_ISSUER != '' && secrets.AMO_JWT_SECRET != '' }}
    steps:
      # Actions are pinned to exact commits so a hijacked tag can't run code next to the keys.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Work out version
        id: ver
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          TAG="v$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "$TAG" ]; then
            echo "::error::manifest.json version ($VERSION) doesn't match tag (${{ github.ref_name }})"
            exit 1
          fi
          HAS_XPI=$(gh release view "$TAG" --json assets --jq '[.assets[].name | select(endswith(".xpi"))] | length' 2>/dev/null || echo none)
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "branch" ] && [ "$HAS_XPI" != "none" ]; then
            echo "Release $TAG already exists; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_XPI" != "none" ] && [ "$HAS_XPI" != "0" ]; then
            echo "Release $TAG already has a signed .xpi; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint
        if: steps.ver.outputs.skip != 'true'
        continue-on-error: true
        run: npx --yes web-ext@8 lint --source-dir . --ignore-files ".github/**" "docs/**" "*.md" --warnings-as-errors=false

      - name: Build unsigned package
        if: steps.ver.outputs.skip != 'true'
        run: |
          npx --yes web-ext@8 build --source-dir . --artifacts-dir dist --overwrite-dest \
            --ignore-files ".github/**" "docs/**" "*.md" --filename "twitch-chat-watcher-${VERSION}-unsigned.zip"

      - name: Sign with Mozilla
        id: sign
        if: steps.ver.outputs.skip != 'true' && env.HAS_AMO_KEYS == 'true'
        env:
          # web-ext reads these itself, so the keys never appear on a command line
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx --yes web-ext@8 sign --source-dir . --artifacts-dir signed --channel unlisted \
            --ignore-files ".github/**" "docs/**" "*.md" \
            --approval-timeout 900000
          XPI=$(ls signed/*.xpi | head -n1)
          cp "$XPI" "dist/twitch-chat-watcher-${VERSION}.xpi"
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
          ID=$(node -p "require('./manifest.json').browser_specific_settings.gecko.id")
          cat > dist/updates.json <<EOF
          {
            "addons": {
              "$ID": {
                "updates": [
                  {
                    "version": "$VERSION",
                    "update_link": "$REPO_URL/releases/download/$TAG/twitch-chat-watcher-${VERSION}.xpi"
                  }
                ]
              }
            }
          }
          EOF
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        if: steps.ver.outputs.skip != 'true'
        run: |
          {
            sed -n "/^## ${VERSION}/,/^## /p" CHANGELOG.md | sed '1d;$d'
            echo
            if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
              echo "### Install"
              echo "Open **twitch-chat-watcher-${VERSION}.xpi** below in Firefox and click **Add**. It updates itself when new releases come out."
            else
              echo "### Install (unsigned build)"
              echo "This release isn't signed yet, so regular Firefox won't install it permanently."
              echo "Unzip **twitch-chat-watcher-${VERSION}-unsigned.zip**, open \`about:debugging#/runtime/this-firefox\`, click **Load Temporary Add-on** and pick \`manifest.json\`."
            fi
          } > notes.md
          cat notes.md

      - name: Publish release
        if: steps.ver.outputs.skip != 'true'
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md --title "Twitch Chat Watcher $TAG"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Twitch Chat Watcher $TAG" --notes-file notes.md
          fi
